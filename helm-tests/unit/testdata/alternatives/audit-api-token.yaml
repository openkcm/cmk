# charts/cmk/values.yaml, config.audit: "Example with an API token". Applied on top of
# ../values-examples.yaml; null removes the settings of the example it replaces.
config:
  audit:
    httpClient:
      mtls: null
      apiToken: { source: file, file: { path: /etc/credentials/audit/token, format: binary } }
      transportAttributes: { tlsHandshakeTimeout: 10s, maxIdleConnsPerHost: 10 }
