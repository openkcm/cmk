{{- if and .Values.apiServer.deploy .Values.networkPolicy.enabled }}
---
# Ingress to the API server pods. Outgoing traffic is not restricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cmk.fullname" . }}
  namespace: {{ include "cmk.namespace" . }}
  labels:
    {{- include "cmk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cmk.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- with .Values.networkPolicy.http.from }}
    # CMK API: only the listed callers (Envoy Gateway).
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.networkPolicy.status.from }}
    # Status endpoints (metrics). Probes from the kubelet are not affected by
    # NetworkPolicies on most network plugins.
    - ports:
        - port: http-status
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
