{{- if .Values.apiServer.deploy }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cmk.fullname" . }}-config
  namespace: {{ include "cmk.namespace" . }}
  labels:
    {{- include "cmk.labels" . | nindent 4 }}
immutable: {{ .Values.config.isImmutable | default false }}
data:
  # The sections of `config` that the API server reads (helper cmk.config in _helpers.tpl).
  config.yaml: |-
    {{- include "cmk.config" (list . .Chart.Name
        "featureGates" "featureFlags" "http" "logger" "status" "certificates"
        "cryptoLayer" "telemetry" "scheduler" "database" "databaseReplicas" "services"
        "plugins" "configurableContext" "provisioning" "audit" "clientData"
        "landscape" "keystorePool" "tenant" "keys" "workflow" "notification"
    ) | nindent 4 }}
{{- end }}
