{{- if and .Values.apiServer.deploy .Values.podDisruptionBudget.enabled }}
{{- $pdb := .Values.podDisruptionBudget }}
{{- if and (hasKey $pdb "minAvailable") (hasKey $pdb "maxUnavailable") }}
{{- fail "podDisruptionBudget: set either minAvailable or maxUnavailable, not both" }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cmk.fullname" . }}
  namespace: {{ include "cmk.namespace" . }}
  labels:
    {{- include "cmk.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cmk.selectorLabels" . | nindent 6 }}
  {{- if hasKey $pdb "minAvailable" }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else if hasKey $pdb "maxUnavailable" }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- else }}
  # Neither minAvailable nor maxUnavailable is set. maxUnavailable: 1 never blocks
  # node drains, even with a single replica.
  maxUnavailable: 1
  {{- end }}
{{- end }}
