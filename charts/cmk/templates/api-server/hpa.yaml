{{- if and .Values.apiServer.deploy .Values.apiServer.autoscaling.enabled }}
{{- if not (or .Values.apiServer.autoscaling.targetCPUUtilizationPercentage .Values.apiServer.autoscaling.targetMemoryUtilizationPercentage) }}
{{- fail "apiServer.autoscaling.enabled requires apiServer.autoscaling.targetCPUUtilizationPercentage or apiServer.autoscaling.targetMemoryUtilizationPercentage" }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cmk.fullname" . }}
  namespace: {{ include "cmk.namespace" . }}
  labels:
    {{- include "cmk.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cmk.fullname" . }}
  minReplicas: {{ .Values.apiServer.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.apiServer.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.apiServer.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.apiServer.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
  {{- with .Values.apiServer.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
