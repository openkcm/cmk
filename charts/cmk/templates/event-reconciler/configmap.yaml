{{- if .Values.eventReconciler.deploy }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cmk.fullname" . }}-event-reconciler-config
  namespace: {{ include "cmk.namespace" . }}
  labels:
    {{- include "cmk.event-reconciler.labels" . | nindent 4 }}
immutable: {{ .Values.config.isImmutable | default false }}
data:
  # The sections of `config` that the event reconciler reads (helper cmk.config in _helpers.tpl).
  config.yaml: |-
    {{- include "cmk.config" (list . "event-reconciler"
        "logger" "status" "audit" "plugins" "services" "telemetry" "database"
        "databaseReplicas" "eventProcessor" "landscape" "cryptoLayer" "featureGates"
        "featureFlags" "certificates" "keystorePool" "tenant" "workflow"
    ) | nindent 4 }}
{{- end }}
