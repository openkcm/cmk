{{- if and .Values.tenantManager.deploy .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cmk.serviceAccountName" . }}-tenant-manager
  namespace: {{ include "cmk.namespace" . }}
  labels:
    {{- include "cmk.tenant-manager.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
