{{- if .Values.tenantManager.deploy }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cmk.fullname" . }}-tenant-manager-config
  namespace: {{ include "cmk.namespace" . }}
  labels:
    {{- include "cmk.tenant-manager.labels" . | nindent 4 }}
immutable: {{ .Values.config.isImmutable | default false }}
data:
  # The sections of `config` that the tenant manager reads (helper cmk.config in _helpers.tpl).
  config.yaml: |-
    {{- include "cmk.config" (list . "tenant-manager"
        "status" "featureGates" "featureFlags" "logger" "telemetry" "database"
        "databaseReplicas" "services" "tenantManager" "plugins" "audit" "certificates"
        "cryptoLayer" "landscape" "keystorePool" "configurableContext" "tenant" "keys"
        "workflow"
    ) | nindent 4 }}
{{- end }}
