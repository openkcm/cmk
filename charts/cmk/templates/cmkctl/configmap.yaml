{{- if .Values.cmkctl.deploy }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cmk.fullname" . }}-cmkctl-config
  namespace: {{ include "cmk.namespace" . }}
  labels:
    {{- include "cmk.cmkctl.labels" . | nindent 4 }}
immutable: {{ .Values.config.isImmutable | default false }}
data:
  # The sections of `config` that the cmkctl reads (helper cmk.config in _helpers.tpl).
  config.yaml: |-
    {{- include "cmk.config" (list . "cmkctl"
        "status" "featureGates" "featureFlags" "logger" "telemetry" "database"
        "databaseReplicas" "scheduler" "plugins" "services" "audit" "certificates"
        "cryptoLayer" "landscape" "keystorePool" "configurableContext" "tenant" "keys"
        "workflow"
    ) | nindent 4 }}
{{- end }}
