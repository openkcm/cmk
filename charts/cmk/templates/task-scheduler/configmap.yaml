{{- if .Values.taskScheduler.deploy }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cmk.fullname" . }}-task-scheduler-config
  namespace: {{ include "cmk.namespace" . }}
  labels:
    {{- include "cmk.task-scheduler.labels" . | nindent 4 }}
immutable: {{ .Values.config.isImmutable | default false }}
data:
  # The sections of `config` that the task scheduler reads (helper cmk.config in _helpers.tpl).
  config.yaml: |-
    {{- include "cmk.config" (list . "task-scheduler"
        "status" "logger" "telemetry" "database" "scheduler" "certificates"
    ) | nindent 4 }}
{{- end }}
