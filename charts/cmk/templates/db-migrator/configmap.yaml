{{- if .Values.dbMigrator.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cmk.fullname" . }}-db-migrator-config
  namespace: {{ include "cmk.namespace" . }}
  labels:
    {{- include "cmk.db-migrator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install, pre-upgrade, post-install, post-upgrade"
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
immutable: {{ .Values.config.isImmutable | default false }}
data:
  # The sections of `config` that the migration jobs read (helper cmk.config in _helpers.tpl).
  # cryptoLayer is read by the tenant data migration 00006 (crypto certificate subjects).
  config.yaml: |-
    {{- include "cmk.config" (list . "db-migrator"
        "status" "logger" "telemetry" "database" "databaseReplicas" "cryptoLayer"
    ) | nindent 4 }}
{{- end }}
