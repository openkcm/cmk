{{- if .Values.taskWorker.deploy }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cmk.fullname" . }}-task-worker-config
  namespace: {{ include "cmk.namespace" . }}
  labels:
    {{- include "cmk.task-worker.labels" . | nindent 4 }}
immutable: {{ .Values.config.isImmutable | default false }}
data:
  # The sections of `config` that the task worker reads (helper cmk.config in _helpers.tpl).
  config.yaml: |-
    {{- include "cmk.config" (list . "task-worker"
        "status" "featureGates" "featureFlags" "logger" "telemetry" "database"
        "databaseReplicas" "scheduler" "configurableContext" "certificates" "services"
        "plugins" "audit" "keystorePool" "keys" "landscape" "cryptoLayer" "tenant"
        "workflow" "notification"
    ) | nindent 4 }}
{{- end }}
