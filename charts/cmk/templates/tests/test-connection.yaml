{{- if and .Values.apiServer.deploy .Values.tests.enabled }}
---
# helm test: checks that the API server answers its readiness probe through the Service.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cmk.fullname" . | trunc 47 | trimSuffix "-" }}-test-connection
  namespace: {{ include "cmk.namespace" . }}
  labels:
    {{- include "cmk.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: wget
      image: {{ .Values.tests.image | quote }}
      command: ["wget"]
      args: ["-q", "-O", "-", "http://{{ include "cmk.fullname" . }}:{{ .Values.tests.port }}/probe/readiness"]
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tests.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
