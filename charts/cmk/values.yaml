# Default values for the OpenKCM CMK chart.
#
# CMK is one binary, `cmkd`, that runs one process per subcommand. The chart deploys each
# process as a Deployment, from the same image and the same configuration:
#   - API server (`apiServer`): the CMK REST API behind Envoy Gateway and ExtAuthZ.
#   - Tenant manager (`tenantManager`): tenant jobs from the Registry over AMQP.
#   - Event reconciler (`eventReconciler`): key and system tasks to the regions over AMQP.
#   - Task scheduler (`taskScheduler`): schedules the periodic tasks. Exactly one replica.
#   - Task worker (`taskWorker`): runs the scheduled and asynchronous tasks.
#   - cmkctl (`cmkctl`, off by default): an administration pod for the `cmkctl` CLI.
# Two Jobs migrate the database schemas before and the data after every install and upgrade
# (`dbMigrator`).
#
# Values marked **Required** must be set for a working installation. Settings of CMK itself
# are under `config`; they are described in the configuration reference:
# https://openkcm.io/components/cmk/security/cmk-config

# -- Override the chart name in resource names and in the `app.kubernetes.io/name` label.
nameOverride: ""

# -- Override the full name of the resources. Default: `<release>-cmk`, or the release name
# if it already contains `cmk`.
fullnameOverride: ""

# -- Namespace of all resources. Empty: the release namespace. Useful when this chart is a
# dependency of another chart.
namespace: ""

# -- Labels added to all resources.
commonLabels: {}

image:
  # -- Registry of the image.
  registry: ghcr.io/openkcm
  # -- Repository of the image in the registry. `cmk/images/cmk-full-plugins` contains
  # `/cmkd`, `/cmkctl`, the database migrations in `/etc/cmk/migrations`, the keystore
  # plugins in `/etc/plugins/keystore` and the identity management plugins in
  # `/etc/plugins/identity-management`. `cmk/images/cmk-full-base` is the same without
  # plugins. The `cmk/images/cmkd` image has no migrations and cannot run the migration jobs.
  repository: cmk/images/cmk-full-plugins
  # -- **Required** unless `digest` is set. CMK version to deploy, for example `v0.11.0`. The
  # chart's appVersion is not used as a fallback.
  tag: ""
  # -- Image digest, for example `sha256:…`. Takes precedence over `tag`.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Path of the `cmkd` binary in the image. The images have no entrypoint; the chart starts
  # this binary with the component's subcommand.
  cmkdPath: /cmkd
  # -- Path of the `cmkctl` binary in the image.
  cmkctlPath: /cmkctl

# -- Secrets for pulling the image from a private registry, for example
# `[{ name: registry-access }]`.
imagePullSecrets: []

serviceAccount:
  # -- Create a ServiceAccount for each component: `<name>` for the API server and
  # `<name>-<component>` for the others. The migration jobs run before the release's resources
  # exist; they use the namespace's `default` ServiceAccount, or `name` if `create` is false.
  create: true
  # -- Set `automountServiceAccountToken` on the ServiceAccounts. CMK does not call the
  # Kubernetes API; the pods never mount the token.
  automount: false
  # -- Annotations for the ServiceAccounts, for example for workload identity.
  annotations: {}
  # -- Base name of the ServiceAccounts. Empty with `create: true`: the chart's full name.
  # With `create: false`, all components use this ServiceAccount, or `default` if empty.
  name: ""

# =============================================================================
# Components
# =============================================================================
# Settings of every component below:
#   deploy                     Deploy the component.
#   image.command              Override the command, as a string or a list. Default: the
#                              component's binary (`image.cmkdPath` or `image.cmkctlPath`).
#   image.args                 Override the arguments. Default: the subcommand, for example
#                              `[api-server]`.
#   extraArgs                  Arguments added after the subcommand, for example
#                              `[--graceful-shutdown=10]` (seconds to wait after the process
#                              stopped; default 1).
#   resources                  Resources of the component. Empty: the shared `resources`.
#   strategy                   Deployment update strategy. Empty: rolling update.
#   topologySpreadConstraints  Topology spread constraints of the component's pods.
# Pod annotations, labels, affinity, probes and volumes are shared; see "Shared by all
# components".

apiServer:
  # -- Deploy the API server. Its replicas are set with `replicaCount` or `autoscaling`.
  deploy: true
  image:
    # -- Override the command (see above).
    command: ""
    # -- Override the arguments (see above).
    args: []
  # -- Arguments added after the subcommand.
  extraArgs: []
  # -- Resources. Empty: the shared `resources`.
  resources: {}
  # -- Update strategy. Empty: rolling update.
  strategy: {}
  # -- Topology spread constraints, for example to spread the replicas across zones.
  topologySpreadConstraints: []

# -- Number of API server replicas, when `autoscaling` is disabled. Use two or more in
# production.
replicaCount: 1

autoscaling:
  # -- Scale the API server with a HorizontalPodAutoscaler. When enabled, `replicaCount` is
  # not used.
  enabled: false
  # -- Minimum number of replicas.
  minReplicas: 2
  # -- Maximum number of replicas.
  maxReplicas: 5
  # -- Target average CPU utilization, in percent of the CPU request. Null: not used.
  targetCPUUtilizationPercentage: 80
  # -- Target average memory utilization, in percent of the memory request. Null: not used.
  # At least one target must be set.
  targetMemoryUtilizationPercentage: 80
  # -- Scaling behavior (`autoscaling/v2` `behavior`). Empty: the Kubernetes defaults.
  behavior: {}

tenantManager:
  # -- Deploy the tenant manager. It needs `config.tenantManager` and the `registry` and
  # `sessionManager` services under `config.services`; without them it does not start.
  deploy: true
  # -- Number of replicas, when `autoscaling` is disabled.
  replicaCount: 1
  autoscaling:
    # -- Scale the tenant manager with a HorizontalPodAutoscaler.
    enabled: false
    # -- Minimum number of replicas.
    minReplicas: 2
    # -- Maximum number of replicas.
    maxReplicas: 5
    # -- Target average CPU utilization, in percent of the CPU request. Null: not used.
    targetCPUUtilizationPercentage: 80
    # -- Target average memory utilization, in percent of the memory request. Null: not used.
    targetMemoryUtilizationPercentage: 80
    # -- Scaling behavior. Empty: the Kubernetes defaults.
    behavior: {}
  image:
    # -- Override the command.
    command: ""
    # -- Override the arguments.
    args: []
  # -- Arguments added after the subcommand.
  extraArgs: []
  # -- Resources. Empty: the shared `resources`.
  resources: {}
  # -- Update strategy. Empty: rolling update.
  strategy: {}
  # -- Topology spread constraints.
  topologySpreadConstraints: []

eventReconciler:
  # -- Deploy the event reconciler. It sends key and system tasks to the regions configured
  # in `config.eventProcessor.targets`.
  deploy: true
  # -- Number of replicas.
  replicaCount: 1
  image:
    # -- Override the command.
    command: ""
    # -- Override the arguments.
    args: []
  # -- Arguments added after the subcommand.
  extraArgs: []
  # -- Resources. Empty: the shared `resources`.
  resources: {}
  # -- Update strategy. Empty: rolling update.
  strategy: {}
  # -- Topology spread constraints.
  topologySpreadConstraints: []

taskScheduler:
  # -- Deploy the task scheduler. It always runs exactly one replica: each replica would
  # schedule every periodic task. Without it, no periodic task runs (key synchronization,
  # certificate rotation, keystore pool, workflow expiry).
  deploy: true
  image:
    # -- Override the command.
    command: ""
    # -- Override the arguments.
    args: []
  # -- Arguments added after the subcommand.
  extraArgs: []
  # -- Resources. Empty: the shared `resources`.
  resources: {}
  # -- Update strategy. `Recreate` stops the old pod before the new one starts, so two
  # schedulers never run at the same time.
  strategy:
    type: Recreate
  # -- Topology spread constraints.
  topologySpreadConstraints: []

taskWorker:
  # -- Deploy the task worker. It runs the scheduled tasks and the asynchronous work of the
  # API server. It needs a `NotificationService` and a `SystemInformationService` plugin and
  # the `registry` service.
  deploy: true
  # -- Number of replicas.
  replicaCount: 1
  image:
    # -- Override the command.
    command: ""
    # -- Override the arguments.
    args: []
  # -- Arguments added after the subcommand.
  extraArgs: []
  # -- Resources. Empty: the shared `resources`.
  resources: {}
  # -- Update strategy. Empty: rolling update.
  strategy: {}
  # -- Topology spread constraints.
  topologySpreadConstraints: []

cmkctl:
  # -- Deploy a pod for administration with the `cmkctl` CLI (`kubectl exec … -- /cmkctl`).
  # The pod idles and holds all CMK credentials; deploy it only while you need it.
  deploy: false
  image:
    # -- Override the command. Default: `image.cmkctlPath`.
    command: ""
    # -- Override the arguments. Default: `[sleep]`.
    args: []
  # -- Arguments added after the subcommand.
  extraArgs: []
  # -- Resources. Empty: the shared `resources`.
  resources: {}
  # -- Update strategy. Empty: rolling update.
  strategy: {}
  # -- Topology spread constraints.
  topologySpreadConstraints: []

dbMigrator:
  # -- Run the database migrations as Helm hooks: the schema migration before every install
  # and upgrade, the data migration after. Both migrate the shared schema and every tenant
  # schema. If disabled, run `cmkd db-migrator` yourself: CMK does not start on an outdated
  # schema. With many tenants, raise Helm's `--timeout` (default 5 minutes).
  enabled: true
  image:
    # -- Override the command. Default: `image.cmkdPath`.
    command: ""
  # -- Arguments added after `db-migrator --target=all --type=<schema|data>`.
  extraArgs: []
  # -- Retries before a job, and with it the install or upgrade, fails.
  backoffLimit: 6
  # -- Maximum run time of a job in seconds. Null: no limit; Helm's `--timeout` still applies.
  activeDeadlineSeconds: null
  # -- Seconds after which a finished job is deleted. Null: successful jobs are deleted by
  # Helm, failed jobs are kept for troubleshooting until the next install or upgrade.
  ttlSecondsAfterFinished: null
  # -- Annotations for the jobs' pods, added to `podAnnotations`. For example
  # `sidecar.istio.io/inject: "false"`, if a service mesh sidecar would keep the jobs from
  # completing.
  podAnnotations: {}
  # -- Resources of the migration containers.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 512Mi
  # -- Additional containers of the jobs' pods. They must exit on their own, or the jobs
  # never complete.
  extraContainers: []

# =============================================================================
# Shared by all components
# =============================================================================

# -- Old ReplicaSets kept for rollbacks.
revisionHistoryLimit: 10

# -- Annotations for all pods. The chart always adds `checksum/config`, which restarts a
# component's pods when its configuration changes.
podAnnotations: {}

# -- Additional labels for all pods.
podLabels: {}

# -- Pod security context of all pods. The defaults run CMK as user and group 65532, the
# non-root user of the published images, with the runtime's default seccomp profile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container security context of all CMK containers. The root filesystem is read-only;
# `/tmp`, where plugins create their sockets, is a writable `emptyDir` (see `tmpVolume`). If a
# plugin writes elsewhere, mount an `emptyDir` there with `extraVolumes`.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

tmpVolume:
  # -- Mount a writable `emptyDir` at `/tmp` in all CMK containers.
  enabled: true
  # -- Size limit of the `/tmp` volume.
  sizeLimit: 128Mi

# -- Inject environment variables for the Services of the namespace. CMK does not need them,
# and a Service named `cmk` would add variables with CMK's `CMK_` prefix.
enableServiceLinks: false

# -- PriorityClass of the component pods. The API server is on the path of every key
# operation; consider a high priority class.
priorityClassName: ""

# -- Seconds a pod has to stop after SIGTERM. Null: the Kubernetes default (30). Keep it
# longer than the components' `--graceful-shutdown` argument.
terminationGracePeriodSeconds: null

# -- Lifecycle hooks of the component containers, for example
# `{ preStop: { sleep: { seconds: 5 } } }` (Kubernetes 1.30 or later) to let load balancers
# remove an API server pod before it stops.
lifecycle: {}

# -- Default resources of the component containers; `<component>.resources` overrides them.
# The ephemeral-storage limit covers the container's logs and the `/tmp` volume; a pod that
# exceeds it is evicted. No CPU limit is set, so request handling is not throttled.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 128Mi
  limits:
    memory: 1Gi
    ephemeral-storage: 512Mi

# -- Startup probe of all components: allows up to 5 minutes for the start, for example to
# load the plugins. Needs `config.status.enabled: true`.
startupProbe:
  httpGet:
    path: /probe/liveness
    port: http-status
    scheme: HTTP
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

# -- Liveness probe of all components.
livenessProbe:
  httpGet:
    path: /probe/liveness
    port: http-status
    scheme: HTTP
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# -- Readiness probe of all components. The readiness endpoint checks the database.
readinessProbe:
  httpGet:
    path: /probe/readiness
    port: http-status
    scheme: HTTP
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# -- Container ports. `http` (API server only) must match `config.http.port`;
# `http-status` must match `config.status.address`. The other components expose only
# `http-status`. The probes, the Service and the NetworkPolicies refer to the ports by name.
ports:
  - name: http-status
    containerPort: 8888
    protocol: TCP
  - name: http
    containerPort: 8081
    protocol: TCP

service:
  # -- Service type of the API server. Keep `ClusterIP`: Envoy Gateway publishes the API
  # after ExtAuthZ has checked each request.
  type: ClusterIP
  # -- Additional labels for the Service.
  labels: {}
  # -- Annotations for the Service.
  annotations: {}
  # -- Service ports. `http` (8081) is the target of Envoy Gateway's route for `/cmk/v1`;
  # `http-status` (8888) serves metrics if enabled. Remove `http-status` if nothing scrapes
  # it through the Service.
  ports:
    - name: http
      port: 8081
      protocol: TCP
      targetPort: http
    - name: http-status
      port: 8888
      protocol: TCP
      targetPort: http-status

# -- Node labels for all pods, including the migration jobs.
nodeSelector: {}

# -- Tolerations for all pods, including the migration jobs.
tolerations: []

# -- Affinity of the component pods.
affinity: {}

podDisruptionBudget:
  # -- Create PodDisruptionBudgets for the API server and the tenant manager. Use them with
  # two or more replicas.
  enabled: false
  # Set at most one of the following. If neither is set, `maxUnavailable: 1` is used.
  # minAvailable: 1
  # maxUnavailable: 1

# -- Additional init containers of all pods, including the migration jobs.
extraInitContainers: []

# -- Additional containers of the component pods. Not added to the migration jobs (see
# `dbMigrator.extraContainers`).
extraContainers: []

# -- Additional volumes of all pods, for example the Secrets with the database password,
# the task queue credentials, certificates, the client data public keys and the plugin
# credentials. Refer to the mounted files from `config` with `source: file`. Every pod gets
# every volume; keep the list to what the components need.
extraVolumes: []
# - name: credentials
#   projected:
#     sources:
#       - secret:
#           name: cmk-database
#           items: [{ key: password, path: database/password }, { key: ca.crt, path: database/ca.crt }]
#       - secret:
#           name: cmk-valkey
#           items: [{ key: password, path: valkey/password }]
# - name: client-data-public-keys
#   secret:
#     secretName: cmk-client-data-public-keys     # ExtAuthZ's public keys only: key1.pem, …

# -- Additional volume mounts of all CMK containers.
extraVolumeMounts: []
# - name: credentials
#   mountPath: /etc/credentials
#   readOnly: true
# - name: client-data-public-keys
#   mountPath: /etc/signing-keys                 # config.clientData.signingKeysPath
#   readOnly: true

# -- Additional environment variables of all CMK containers. Plugin processes inherit them:
# do not put credentials here that plugins should not see. An environment variable can only
# change a setting that exists in the configuration file; the prefix depends on the process
# (`CMK_`, `TENANT_MANAGER_`, `EVENT_RECONCILER_`, `CMK_TASK_SCHEDULER_`, `CMK_TASK_WORKER_`,
# `DB_MIGRATOR_`).
extraEnvs: []

# -- Additional `envFrom` sources of all CMK containers.
extraEnvsFrom: []

# -- Name of the ConfigMap with the feature flags file, when `config.featureFlags.enabled`
# is true. It is mounted in the directory of `config.featureFlags.filePath`; its key must be
# the file name (`flags.yaml` by default).
featureFlagsConfigMap: ""

networkPolicy:
  # -- **Recommended.** Create NetworkPolicies that allow ingress to the component pods only
  # from the peers below. Outgoing traffic is not restricted.
  enabled: false
  http:
    # -- Peers allowed on the API server's `http` port: Envoy Gateway. Empty: none.
    from: []
    # - namespaceSelector:
    #     matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
  status:
    # -- Peers allowed on the `http-status` port of every component, for example a metrics
    # collector. Empty: none. Probes from the kubelet are not affected on most network plugins.
    from: []
  # -- Additional ingress rules of the API server, in NetworkPolicy syntax.
  extraIngress: []

tests:
  # -- Create the `helm test` pod, which calls the API server's readiness endpoint through
  # the Service.
  enabled: true
  # -- Image of the test pod. It needs `wget`.
  image: busybox:1.37
  # -- Service port of the readiness endpoint (`http-status`).
  port: 8888
  # -- Resources of the test container.
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
      ephemeral-storage: 16Mi
    limits:
      memory: 32Mi
      ephemeral-storage: 32Mi

# =============================================================================
# Configuration
# =============================================================================

# CMK configuration.
#
# Where it goes: every component has its own ConfigMap (templates/<component>/configmap.yaml),
# named `<fullname>-config` for the API server and `<fullname>-<component>-config` for the
# others. It holds `config.yaml`, mounted at `/etc/cmk/config.yaml` (tenant manager:
# `/etc/tenant-manager/config.yaml`). Each ConfigMap writes only the sections its process
# reads; the "Read by" line of each section below names those processes. `application.name`
# is set per component.
#
# Changes: a configuration change restarts the affected pods (`checksum/config` annotation).
# The migration jobs run with the db-migrator ConfigMap on every install and upgrade.
#
# Startup checks: CMK rejects unknown keys, so a misspelled or misplaced key stops the
# process with `has invalid keys: <key>`. It also checks `scheduler.tasks`,
# `certificates.validityDays`, `cryptoLayer.certX509Trusts` and the `tenant` limits.
#
# Value references: settings marked "value reference" take one of
#   { source: embedded, value: "…" }                     the value itself, stored in plain text
#                                                         in the ConfigMap
#   { source: env, env: NAME }                            an environment variable, see `extraEnvs`
#   { source: file, file: { path: …, format: binary } }   the content of a file, for example from
#                                                         a Secret mounted with `extraVolumes`;
#                                                         `format: json` or `yaml` with `jsonPath`
#                                                         reads one field of the file
# **Use `source: file` for every password, key and token.**
#
# Credentials (`secretRef`) of the Registry, Session Manager, Valkey and AMQP connections:
#   { type: insecure }   no TLS. Only inside a service mesh that encrypts the traffic.
#   { type: mtls, mtls: { cert: …, certKey: …, serverCa: …, attributes: { serverName: … } } }
#                        TLS with a client certificate. `cert`, `certKey` (client certificate and
#                        key) and `serverCa` (CA of the server certificate) are value references;
#                        `attributes.serverName` overrides the expected server name.
config:
  # -- Create the ConfigMaps as immutable. The ConfigMap names do not change with their
  # content, so with `true` every upgrade that changes the configuration fails: Kubernetes
  # rejects changes to an immutable ConfigMap. Chart versions before 0.2.0 defaulted to
  # `true`; see the upgrade notes in the README. Not written into `config.yaml`.
  isImmutable: false

  # ---------------------------------------------------------------------------
  # application. Read by: all components.
  # ---------------------------------------------------------------------------

  # -- Environment name, written as `application.environment`. Attached to logs, traces,
  # metrics and audit events.
  environment: production

  # -- Additional attributes, written as `application.labels`, attached to logs, traces and
  # metrics. Example: `{ landscape: eu10, team: kms }`.
  labels: {}

  # ---------------------------------------------------------------------------
  # featureGates and featureFlags. Read by: API server, tenant manager, event reconciler,
  # task worker, cmkctl.
  # ---------------------------------------------------------------------------

  featureGates:
    # -- Allow BYOK (bring your own key) keys. Applies only while `featureFlags.enabled` is
    # false; with feature flags, the flag `enable_byok_<plugin>` decides per keystore. CMK
    # reads no other feature gate.
    allow-byok: false

  # Feature flags file (OpenFeature, GO Feature Flag format), re-read while running. Flag
  # names, where <plugin> is the keystore plugin name in lower case:
  #   enable_byok_<plugin>           allow BYOK keys in this keystore
  #   enable_hyok_<plugin>           allow HYOK keys in this keystore
  #   detect_hyok_rotation_<plugin>  detect new key versions of HYOK keys
  # Without feature flags, HYOK and rotation detection are allowed for every keystore and BYOK
  # follows `featureGates.allow-byok`. Flags apply to all tenants. Example file:
  #   enable_hyok_aws:
  #     variations: { "on": true, "off": false }
  #     defaultRule: { variation: "on" }
  featureFlags:
    # -- Use the feature flags file. Needs `featureFlagsConfigMap`, which mounts the file;
    # the chart fails to render without it.
    enabled: false
    # -- Path of the feature flags file. `featureFlagsConfigMap` is mounted at the directory
    # of this path, so the file name must be a key of that ConfigMap.
    filePath: /etc/featureflags/flags.yaml
    # -- How often the file is re-read, as a duration (`30s`, `5m`).
    pollingInterval: 60s

  # ---------------------------------------------------------------------------
  # logger. Read by: all components.
  # ---------------------------------------------------------------------------
  logger:
    # -- Log level: `debug`, `info`, `warn` or `error`. **At `debug`, CMK logs its complete
    # configuration**, including embedded secrets. Use `info` in production.
    level: info
    # -- Log format: `json` or `text`. Any other value stops the process at its first log
    # entry.
    format: json
    # -- Add the source file and line of each log call to the entry.
    source: false
    formatter:
      time:
        # -- Timestamp format: `pattern` (Go time layout below) or `unix`.
        type: pattern
        # -- Go time layout, for `type: pattern`.
        pattern: "Mon Jan 02 15:04:05 -0700 2006"
        # -- Precision, for `type: unix`: `1ns`, `1us`, `1ms` or `1s`.
        precision: 1s
      fields:
        # -- Name of the error field.
        error: error
        # -- Name of the message field.
        message: msg
        # -- Name of the level field.
        level: level
        # -- Name of the timestamp field.
        time: time
        otel:
          # -- Name of the trace ID field, set when the request is traced.
          traceID: trace.id
          # -- Name of the span ID field.
          spanID: span.id
        masking:
          # -- Fields whose values are masked, keeping the first four characters.
          pii:
            - email
            - ip-address
          # -- Fields whose values are replaced with the given mask.
          other:
            jwt-token: "*****"

  # ---------------------------------------------------------------------------
  # status. Read by: all components.
  # ---------------------------------------------------------------------------
  status:
    # -- Serve the status endpoints: `/probe/liveness`, `/probe/readiness` (checks the
    # database), `/version`, and `/metrics` with Prometheus metrics. **Keep enabled**: the
    # probes and the test pod use these endpoints.
    enabled: true
    # -- Listen address of the status server. Must match the `http-status` container port.
    address: ":8888"
    # -- Timeout of the readiness checks, as a duration.
    timeout: 10s
    # -- Serve Go profiling endpoints (`/debug/pprof`) on the status port, without
    # authentication. Keep false in production.
    profiling: false

  # ---------------------------------------------------------------------------
  # telemetry: OpenTelemetry export of traces, metrics and logs. Read by: all components.
  # ---------------------------------------------------------------------------
  # Each of `traces`, `metrics` and `logs` takes:
  #   enabled     export this signal
  #   protocol    `grpc` or `http`. Required when enabled.
  #   host        collector `host:port`; value reference
  #   url         URL path, for `protocol: http`, for example `/v1/traces`
  #   secretRef   `insecure` (no TLS), `mtls`, `api-token` (with `apiToken`, a value reference)
  #               or `basic` (with `basic.username` and `basic.password`)
  # Example:
  #   traces:
  #     enabled: true
  #     protocol: grpc
  #     host: { value: otel-collector.observability.svc.cluster.local:4317 }
  #     secretRef: { type: insecure }
  telemetry:
    traces:
      # -- Export traces.
      enabled: false
      # -- `grpc` or `http`.
      protocol: grpc
      # -- Collector `host:port`; value reference.
      host:
        source: embedded
        value: ""
      # -- URL path, for `protocol: http`.
      url: ""
      # -- Credentials, see the list above.
      secretRef:
        type: insecure
    metrics:
      # -- Collect metrics. Exported over OTLP, or with `prometheus.enabled` served on
      # `/metrics` of the status port instead.
      enabled: false
      # -- `grpc` or `http`, for the OTLP export.
      protocol: grpc
      # -- Collector `host:port`; value reference.
      host:
        source: embedded
        value: ""
      # -- URL path, for `protocol: http`.
      url: ""
      # -- Credentials, see the list above.
      secretRef:
        type: insecure
      prometheus:
        # -- Serve the metrics on `/metrics` of the status port instead of exporting them.
        # Needs `metrics.enabled`. Allow the scraper with `networkPolicy.status.from`.
        enabled: false
    logs:
      # -- Export the log entries over OTLP, in addition to standard output.
      enabled: false
      # -- `grpc` or `http`.
      protocol: grpc
      # -- Collector `host:port`; value reference.
      host:
        source: embedded
        value: ""
      # -- URL path, for `protocol: http`.
      url: ""
      # -- Credentials, see the list above.
      secretRef:
        type: insecure

  # ---------------------------------------------------------------------------
  # audit: audit events as OTLP/HTTP log records. Read by: API server, tenant manager,
  # event reconciler, task worker, cmkctl.
  # ---------------------------------------------------------------------------
  # Events: key lifecycle, key availability, system linking, tenant deletion and rejected
  # requests. A failed delivery is logged (`Failed to send audit log …`) and does not fail the
  # request; with an empty `endpoint`, no event is delivered.
  audit:
    # -- OTLP/HTTP logs endpoint, for example
    # `https://otel-collector.observability.svc.cluster.local:4318/v1/logs`.
    endpoint: ""
    # -- HTTP client of the audit endpoint. Besides `timeout`: `mtls` (`cert`, `certKey`,
    # `serverCa`, value references), `apiToken` (value reference), `basicAuth` (`username`,
    # `password`), `oauth2Auth` (`url`, `credentials.clientID`, `credentials.clientSecret`,
    # `credentials.authMethod`). Example:
    #   httpClient:
    #     timeout: 10s
    #     mtls:
    #       cert:     { source: file, file: { path: /etc/credentials/audit/tls.crt, format: binary } }
    #       certKey:  { source: file, file: { path: /etc/credentials/audit/tls.key, format: binary } }
    #       serverCa: { source: file, file: { path: /etc/credentials/audit/ca.crt, format: binary } }
    httpClient:
      timeout: 10s
    # -- Attributes added to every event, as a YAML map of strings. Example:
    #   additionalProperties: |
    #     appID: cmk
    #     region: eu10
    additionalProperties: ""

  # ---------------------------------------------------------------------------
  # http: the CMK API. Read by: API server.
  # ---------------------------------------------------------------------------
  # The chart writes `http.address: ":<port>"` and `http.swaggerEnabled`. The shutdown grace
  # period is CMK's default of 5 seconds. TLS is terminated by Envoy Gateway.
  http:
    # -- Port of the CMK API. Must match the `http` container port.
    port: 8081
    # -- Serve the API description at `/cmk/v1/swagger`, without authentication. Keep false in
    # production.
    swaggerEnabled: false

  # ---------------------------------------------------------------------------
  # clientData: verification of the signed client data from ExtAuthZ. Read by: API server.
  # ---------------------------------------------------------------------------
  clientData:
    # -- **Required.** Directory with ExtAuthZ's **public** keys, one `<key ID>.pem` per key
    # (PEM public key or certificate, RS256). Mount it with `extraVolumes` and
    # `extraVolumeMounts`; startup fails if it does not exist. Keep the old and the new key
    # during a key rotation. Never put private keys here.
    signingKeysPath: /etc/signing-keys
    # -- Entries of the client data `auth_context` that CMK keeps and passes to the identity
    # management plugin. **Must include `issuer`**: CMK lists a user's tenants by the issuer
    # of their identity provider.
    authContextFields:
      - issuer
      - client_id

  # ---------------------------------------------------------------------------
  # services: gRPC connections to the Registry and to Session Manager. Read by: API server,
  # tenant manager, event reconciler, task worker, cmkctl.
  # ---------------------------------------------------------------------------
  # CMK watches the directories of the mTLS files and reconnects when they change, so
  # renewed certificates are used without a restart. Example with mTLS:
  #   registry:
  #     enabled: true
  #     address: registry.services.svc.cluster.local:9092
  #     secretRef:
  #       type: mtls
  #       mtls:
  #         cert:     { source: file, file: { path: /etc/credentials/registry/tls.crt, format: binary } }
  #         certKey:  { source: file, file: { path: /etc/credentials/registry/tls.key, format: binary } }
  #         serverCa: { source: file, file: { path: /etc/credentials/registry/ca.crt, format: binary } }
  services:
    registry:
      # -- **Required** by the tenant manager and the task worker; also used by the API server
      # and the event reconciler.
      enabled: false
      # -- `host:port` of the gRPC API of the central Registry, which all CMK regions share,
      # for example `registry.services.svc.cluster.local:9092`. Startup fails if empty
      # while enabled.
      address: ""
      # -- Credentials: `insecure` or `mtls`, see the top of this section.
      secretRef:
        type: insecure
      attributes:
        # -- Interval of the gRPC keepalive pings.
        keepaliveTime: 80s
        # -- Time to wait for a keepalive answer before the connection is closed.
        keepaliveTimeout: 40s
    sessionManager:
      # -- **Required** by the tenant manager, which writes, blocks and removes the tenant
      # trust records.
      enabled: false
      # -- `host:port` of Session Manager's gRPC API, for example
      # `session-manager.services.svc.cluster.local:9091`.
      address: ""
      # -- Credentials: `insecure` or `mtls`.
      secretRef:
        type: insecure
      attributes:
        # -- Interval of the gRPC keepalive pings.
        keepaliveTime: 80s
        # -- Time to wait for a keepalive answer before the connection is closed.
        keepaliveTimeout: 40s

  # ---------------------------------------------------------------------------
  # database: PostgreSQL. Read by: all components.
  # ---------------------------------------------------------------------------
  # CMK keeps shared data in one schema and creates one schema per tenant, so the database
  # user needs the `CREATE` privilege on the database. The values are written into
  # the connection string without quoting: use a password without spaces, quotes or
  # backslashes.
  database:
    # -- **Required.** Host name; value reference.
    host:
      source: embedded
      value: ""
    # -- Port, as a string.
    port: "5432"
    # -- Database name.
    name: cmk
    # -- **Required.** User name; value reference.
    user:
      source: embedded
      value: ""
    # -- **Required.** Password; value reference. Use `source: file`.
    secret:
      source: embedded
      value: ""
    parameters:
      ssl:
        # -- PostgreSQL `sslmode`. `verify-full` checks the server certificate and the host
        # name; `verify-ca` checks only the certificate; `require` encrypts without checking;
        # `prefer`, `allow` and `disable` may use plain text.
        mode: verify-full
        # -- CA certificate file of the database server. Empty: the system CAs of the image.
        rootCert: ""
        # -- Client certificate file, for certificate authentication.
        cert: ""
        # -- Client key file, for certificate authentication.
        key: ""
    # -- Migration directories in the image, used by the db-migrator jobs and by the tenant
    # manager for new tenant schemas. Keep the defaults with the `cmk-full-*` images. With
    # wrong paths CMK logs `No migration files found, skipping` and creates empty schemas.
    migrator:
      shared:
        schema: /etc/cmk/migrations/shared/schema
        data: /etc/cmk/migrations/shared/data
      tenant:
        schema: /etc/cmk/migrations/tenant/schema
        data: /etc/cmk/migrations/tenant/data

  # -- Read replicas, each with the fields of `database` (`host`, `port`, `name`, `user`,
  # `secret`, `parameters`). Read queries go to a random replica, writes to `database`; a
  # lagging replica returns outdated data. Read by: all components except the task scheduler.
  # Example:
  #   databaseReplicas:
  #     - host: { value: postgres-replica.storage.svc.cluster.local }
  #       port: "5432"
  #       name: cmk
  #       user: { value: cmk }
  #       secret: { source: file, file: { path: /etc/credentials/db/password, format: binary } }
  #       parameters: { ssl: { mode: verify-full } }
  databaseReplicas: []

  # ---------------------------------------------------------------------------
  # scheduler: asynchronous tasks through a Redis-compatible queue such as Valkey. Read by:
  # API server, task scheduler, task worker, cmkctl.
  # ---------------------------------------------------------------------------
  scheduler:
    taskQueue:
      # -- **Required.** Host name; value reference.
      host:
        source: embedded
        value: ""
      # -- Port, as a string.
      port: "6379"
      acl:
        # -- Authenticate with the user name and password below.
        enabled: false
        # -- User name; value reference.
        username:
          source: embedded
          value: ""
        # -- Password; value reference. Use `source: file`.
        password:
          source: embedded
          value: ""
      # -- Transport security: `mtls` or `insecure`; other types fail with
      # `unsupported secret type for task queue`. With `insecure`, the ACL user name and
      # password are sent in plain text.
      secretRef:
        type: insecure
    # -- Changes to the built-in task schedule. Every task type runs on its default schedule
    # unless an entry changes it:
    #   sys:refresh          hourly           refresh system information from the Registry
    #   key:sync             every 5 minutes  check the HYOK keys in the customer keystores
    #   keystore:fill        hourly           keep `keystorePool.size` keystores prepared
    #   cert:rotate          daily 00:00      renew certificates close to expiry
    #   workflow:expire      daily 01:00      expire open approval workflows
    #   workflow:cleanup     daily 02:00      delete finished workflows after their retention
    #   tenant:refresh-name  daily 03:00      refresh tenant names
    # Each entry: `taskType` (one of the above, at most one entry each), `enabled`, `cronspec`
    # (cron expression or `@every <duration>`), `retries` (default 3), `timeOut`, and for
    # `key:sync` `fanOutTask.{enabled,retries,timeOut}` (one subtask per tenant). Example:
    #   - { taskType: key:sync, cronspec: "*/15 * * * *" }
    #   - { taskType: tenant:refresh-name, enabled: false }
    tasks: []

  # ---------------------------------------------------------------------------
  # tenantManager: jobs of this region's tenants from the central Registry over AMQP. Read
  # by: tenant manager, cmkctl.
  # ---------------------------------------------------------------------------
  # **Required** when `tenantManager.deploy` is true: the tenant manager does not start
  # without `secretRef.type` and the three `amqp` fields. `amqp.source` and `amqp.target`
  # must equal the `target` and `source` of the Registry's `orbital.targets` entry for this
  # CMK region: CMK does not check a tenant's region itself. Example:
  #   secretRef:
  #     type: mtls
  #     mtls:
  #       cert:     { source: file, file: { path: /etc/credentials/amqp/tls.crt, format: binary } }
  #       certKey:  { source: file, file: { path: /etc/credentials/amqp/tls.key, format: binary } }
  #       serverCa: { source: file, file: { path: /etc/credentials/amqp/ca.crt, format: binary } }
  #   amqp:
  #     url: amqps://rabbitmq.services.svc.cluster.local:5671
  #     source: /queues/cmk.tenants.requests
  #     target: /exchanges/cmk/mesh.tenants
  tenantManager:
    # -- Credentials: `mtls` (TLS and certificate authentication) or `insecure`.
    secretRef:
      type: ""
    amqp:
      # -- Broker URL. **Use `amqps://`**: with `amqp://` no TLS is used, even with `mtls`.
      # A user name and password in the URL replace the certificate authentication.
      url: ""
      # -- Address CMK receives tenant requests from.
      source: ""
      # -- Address CMK sends replies to.
      target: ""
    # -- Time allowed for terminating a tenant, as a duration.
    terminationTimeout: 48h

  # ---------------------------------------------------------------------------
  # eventProcessor: key and system tasks to the regions over AMQP. Read by: event reconciler,
  # API server.
  # ---------------------------------------------------------------------------
  # **Required** when `eventReconciler.deploy` is true: every key and system task for a
  # region without a target fails with `target not configured for region`. Example:
  #   secretRef: { type: mtls, mtls: { cert: …, certKey: …, serverCa: … } }
  #   targets:
  #     - region: eu10
  #       amqp:
  #         url: amqps://rabbitmq.services.svc.cluster.local:5671
  #         target: /exchanges/cmk/eu10.requests
  #         source: /queues/cmk.eu10.replies
  eventProcessor:
    # -- Credentials: `mtls` enables TLS and certificate authentication; any other type
    # connects without TLS.
    secretRef:
      type: ""
    # -- One target per region: `region`, `amqp.url` (`amqps://`), `amqp.target` (address
    # for requests), `amqp.source` (address for replies).
    targets: []
    # -- Retries per task, with exponential backoff from 10 seconds up to about 3 hours. The
    # default of 18 retries spans about one day.
    maxReconcileCount: 18

  # ---------------------------------------------------------------------------
  # plugins. Read by: API server, tenant manager, event reconciler, task worker, cmkctl.
  # ---------------------------------------------------------------------------
  # -- **Required.** Plugins for keystores, identity management, notifications, system
  # information and certificates. Each entry:
  #   name               plugin name; selects a built-in plugin and names its feature flags
  #   type               KeystoreInstanceKeyOperation, KeystoreProvider (any number);
  #                      IdentityManagementService, NotificationService,
  #                      SystemInformationService, CertificateIssuerService (at most one each)
  #   path               external plugin binary; empty selects a built-in plugin
  #   checksum           SHA-256 of the binary, hex; set it for external plugins
  #   yamlConfiguration  plugin settings, as a YAML string
  #   logLevel           log level of the plugin
  #   tags               `default_keystore` (keystore for BYOK keys), `hyok` (HYOK keystore)
  #   args, env          arguments and extra environment variables of the plugin process
  #   disabled           skip the plugin
  # The task worker needs a `NotificationService` and a `SystemInformationService` plugin.
  # Plugin processes inherit all environment variables of the pod: pass plugin credentials
  # through files. Examples for every plugin: https://openkcm.io/components/cmk/security/cmk-plugins
  #   - name: AWS
  #     type: KeystoreInstanceKeyOperation
  #     path: /etc/plugins/keystore/keystoreop-aws
  #     tags: [default_keystore, hyok]
  #     yamlConfiguration: |
  #       # plugin-specific settings
  #   - { name: noop, type: NotificationService }
  #   - { name: noop, type: SystemInformationService }
  plugins: []

  # ---------------------------------------------------------------------------
  # certificates: client certificates CMK requests from the certificate issuer plugin. Read
  # by: API server, tenant manager, event reconciler, task scheduler, task worker, cmkctl.
  # ---------------------------------------------------------------------------
  certificates:
    # -- Root certificate URL returned with HYOK client certificates.
    rootCertURL: ""
    # -- Validity of the certificates CMK requests, in days: 7 to 30. Startup fails outside
    # this range.
    validityDays: 30
    # -- `cert:rotate` renews certificates that expire within this many days.
    rotationThresholdDays: 7
    # -- Prefix of the common name of tenant certificates.
    defaultTenantCertPrefix: ""
    # -- Do not issue client certificates for HYOK keystores.
    disableHYOKCertAuth: false

  # ---------------------------------------------------------------------------
  # cryptoLayer: certificates trusted by the regional crypto layer. Read by: API server,
  # tenant manager, event reconciler, task worker, cmkctl, db-migrator (data migration that
  # updates the certificate subjects of existing keys).
  # ---------------------------------------------------------------------------
  cryptoLayer:
    # -- Value reference to a YAML list. Each entry: `name` (region), `rootCA` (URL),
    # `subject` with `locality`, `country`, `organization`, `organizationUnit` (lists) and
    # `commonNamePrefix` (at most 24 characters; startup fails otherwise). Example value:
    #   - name: eu10
    #     rootCA: https://pki.example.com/root-ca.crt
    #     subject:
    #       locality: [eu10]
    #       country: [DE]
    #       organization: [Example]
    #       organizationUnit: [KMS]
    #       commonNamePrefix: kms-crypto_
    certX509Trusts:
      source: embedded
      value: "[]"

  # ---------------------------------------------------------------------------
  # keystorePool: keystores prepared in advance for new tenants. Read by: API server, tenant
  # manager, event reconciler, task worker, cmkctl.
  # ---------------------------------------------------------------------------
  keystorePool:
    # -- Number of prepared keystores that the `keystore:fill` task keeps in the pool.
    size: 2
    # -- How often the API server records the pool fill level metric, as a duration. Must be
    # greater than zero, otherwise the metric is not recorded.
    interval: 10m
    # -- Regions of the keystores, passed to the keystore provider plugins: list of `name`
    # (display name) and `technicalName` (provider region). Example:
    #   - { name: Europe (Frankfurt), technicalName: eu-central-1 }
    supportedRegions: []

  # ---------------------------------------------------------------------------
  # provisioning: keystore added to the pool at startup. Read by: API server.
  # ---------------------------------------------------------------------------
  provisioning:
    initKeystoreConfig:
      # -- Add the keystore below to the pool when the API server starts.
      enabled: false
      # -- Keystore provider, for example `AWS`.
      provider: ""
      # -- Keystore settings, all required when enabled: `localityId`, `commonName`,
      # `managementAccessData` (YAML string with the provider's access data) and
      # `supportedRegions` (`name`, `technicalName`). Example:
      #   localityId: 12345678-90ab-cdef-1234-567890abcdef
      #   commonName: kms.example.com
      #   managementAccessData: |
      #     roleArn: arn:aws:iam::123456789012:role/KMSServiceRole
      #   supportedRegions:
      #     - { name: Europe (Frankfurt), technicalName: eu-central-1 }
      value: {}

  # ---------------------------------------------------------------------------
  # landscape: this CMK installation. Read by: API server, tenant manager, event reconciler,
  # task worker, cmkctl.
  # ---------------------------------------------------------------------------
  landscape:
    # -- Landscape name, shown in notifications.
    name: ""
    # -- URL of the CMK UI, ending with `#`, used for links in notifications. Example:
    # `https://ui.cmk.example.com/#`.
    uiBaseUrl: ""
    # -- Region of this installation, like: `aws-qa-eu`. Used in notifications, as the default locality of
    # client certificates, and sent with key and system tasks.
    region: ""

  # ---------------------------------------------------------------------------
  # tenant: default limits of every tenant of this region. Read by: API server, tenant
  # manager, event reconciler, task worker, cmkctl.
  # ---------------------------------------------------------------------------
  # The Registry's `UpdateTenantConfig` overrides `systemLimit` and `keyLimit` for one tenant.
  tenant:
    # -- Maximum number of systems linked to one key configuration. At least 1.
    systemLimit: 50
    # -- Maximum number of keys in one key configuration, not counting deleted and detached
    # keys. At least 1.
    keyLimit: 10
    # -- Maximum number of key configurations per tenant. At least 1.
    keyConfigLimit: 5

  # ---------------------------------------------------------------------------
  # keys. Read by: API server, tenant manager, task worker, cmkctl.
  # ---------------------------------------------------------------------------
  keys:
    # -- Time after which a key in `PENDING_REGISTRATION` becomes `FORBIDDEN`.
    pendingRegistrationTimeout: 15m
    # -- Time after which a key in `PENDING_CREATION` becomes `ERROR`.
    pendingCreationTimeout: 15m

  # ---------------------------------------------------------------------------
  # workflow: defaults of approval workflows for tenants without their own settings. Read
  # by: API server, tenant manager, event reconciler, task worker, cmkctl.
  # ---------------------------------------------------------------------------
  # 0 keeps CMK's default.
  workflow:
    # -- Approvals required, 2 to 5. Higher values are reduced to 5.
    defaultMinimumApprovals: 2
    # -- Days that finished workflows are kept, 7 to 30. Values outside are moved into the
    # range.
    defaultRetentionPeriodDays: 30
    # -- Days after which an open workflow expires.
    defaultExpiryPeriodDays: 7
    # -- Maximum expiry a tenant can set, in days. Higher values are reduced to 7.
    defaultMaxExpiryPeriodDays: 7

  # ---------------------------------------------------------------------------
  # configurableContext: properties of systems. Read by: API server, tenant manager, task
  # worker, cmkctl.
  # ---------------------------------------------------------------------------
  # -- Value reference to YAML with a `system` map. `identifier`, `region` and `type` are
  # the built-in properties (`internal: true`); every other entry is an additional property
  # stored for each system. Each property: `displayName` (label in the UI), `internal`,
  # `optional` (may be empty), `default` (value if empty).
  configurableContext:
    source: embedded
    value: |
      system:
        identifier:
          displayName: "GTID"
          internal: true
        region:
          displayName: "Region"
          internal: true
        type:
          displayName: "Type"
          internal: true
        externalName:
          displayName: "Name"
          default: "n/a"
          optional: true
        roleName:
          displayName: "Role"
          optional: true
        roleID:
          displayName: "RoleID"
          optional: true
