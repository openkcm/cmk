# Values for local development with `make start-cmk` (k3d), applied on top of values.yaml.
# They contain development credentials: never use them elsewhere. Not part of the chart
# package (.helmignore).

# The development image (Dockerfile.dev) has the binaries in /bin.
image:
  registry: ""
  repository: cmk-api-server-dev
  tag: latest
  cmkdPath: /bin/cmkd
  cmkctlPath: /bin/cmkctl

cmkctl:
  deploy: true

extraInitContainers:
  - name: wait-for-postgresql
    image: busybox:1.35
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    command:
      - sh
      - -c
      - |
        until nc -z cmk-postgresql 5432; do
          echo "Waiting for PostgreSQL..."
          sleep 3
        done

# Secrets that `make create-plugin-secret` creates from env/secret, which
# `make create-empty-secrets` copies from env/blueprints (`make generate-signing-keys` adds
# the signing keys):
#   event-processor-credentials  /etc/event-processor/secrets.json, a JSON object with the
#       PEM strings `serverCA`, `cert` and `certKey` (line breaks as `\n`), for an mtls
#       `config.eventProcessor.secretRef` with `format: json` and `jsonPath: "$.cert"`, ….
#       Not read here: `secretRef.type` is `insecure`.
#   scim  /etc/credentials/identity-management/scim.json, a JSON object with the strings
#       `host` (base URL of the SCIM API), `auth.cert` and `auth.certKey` (PEM client
#       certificate and its private key, line breaks as `\n`), `params.groupAttribute`,
#       `params.userAttribute`, `params.groupMembersAttribute` and `params.listMethod`: the
#       settings of the scim plugin below. Value references select a field with `jsonPath`
#       in dot notation, such as `$.auth.cert` (see "Value references" in values.yaml).
#   signing-keys  /etc/signing-keys (`config.clientData.signingKeysPath`): `key01.pem`, the
#       RSA public key (`-----BEGIN PUBLIC KEY-----`) with which CMK verifies client data
#       signed with key ID `key01`, and `private_key01.pem`, its private key, with which
#       cmd/clientData signs test requests; CMK does not use the private key.
extraVolumes:
  - name: event-processor
    secret:
      secretName: event-processor-credentials
  - name: identity-management
    secret:
      secretName: scim
  - name: signing-keys
    secret:
      secretName: signing-keys
extraVolumeMounts:
  - name: event-processor
    mountPath: /etc/event-processor
    readOnly: true
  - name: signing-keys
    mountPath: /etc/signing-keys
    readOnly: true
  - name: identity-management
    mountPath: /etc/credentials/identity-management
    readOnly: true
extraEnvs:
  - name: AWS_KMS_HOST
    value: "localhost"
  - name: AWS_KMS_PORT
    value: "8081"

config:
  environment: dev

  featureGates:
    allow-byok: false

  logger:
    level: debug

  # Metrics on /metrics of the status port.
  telemetry:
    metrics:
      enabled: true
      prometheus:
        enabled: true

  certificates:
    defaultTenantCertPrefix: "examplekms-cmk_"

  cryptoLayer:
    certX509Trusts:
      source: embedded
      value: |
        - name: crypto-1
          rootCA: "https://aia.pki.co.example.com/aia/EXAMPLE%20Cloud%20Root%20CA.crt"
          subject:
            locality: [eu10]
            country: [DE]
            organization: [Organization]
            organizationUnit: [Organization Unit 1, Organization Unit 2]
            commonNamePrefix: kms-crypto_

  database:
    host: { value: cmk-postgresql.cmk.svc.cluster.local }
    user: { value: postgres }
    secret: { value: secret }
    parameters:
      ssl:
        mode: disable

  scheduler:
    taskQueue:
      host: { value: cmk-redis-master.cmk.svc.cluster.local }
      acl:
        enabled: true
        username: { value: default }
        password: { value: secret }
    tasks:
      - { cronspec: "@every 1h", taskType: "sys:refresh", retries: 3 }
      - { cronspec: "@every 24h", taskType: "cert:rotate", retries: 3 }
      - { cronspec: "@every 24h", taskType: "workflow:cleanup", retries: 3 }
      - { cronspec: "@every 24h", taskType: "workflow:expire", retries: 3 }
      - cronspec: "*/5 * * * *"
        taskType: "key:sync"
        retries: 3
        timeOut: 5m
        fanOutTask:
          enabled: true
          retries: 0
          timeOut: 2m
      - { cronspec: "@every 1h", taskType: "keystore:fill", retries: 3 }

  services:
    registry:
      enabled: true
      address: registry.cmk.svc.cluster.local:9092
    sessionManager:
      enabled: true
      address: session-manager.session-manager.svc.cluster.local:9091

  tenantManager:
    secretRef:
      type: insecure
    amqp:
      url: amqp://guest:guest@rabbitmq.cmk.svc.cluster.local:5672
      target: cmk.global.tenants
      source: cmk.emea.tenants

  eventProcessor:
    secretRef:
      type: insecure
    targets:
      - region: eu10
        amqp: { url: "amqp://guest:guest@rabbitmq.cmk.svc.cluster.local:5672", target: "integration.eu10", source: "cmk.keys" }
      - region: eu20
        amqp: { url: "amqp://guest:guest@rabbitmq.cmk.svc.cluster.local:5672", target: "integration.eu20", source: "cmk.keys" }
      - region: eu30
        amqp: { url: "amqp://guest:guest@rabbitmq.cmk.svc.cluster.local:5672", target: "integration.eu30", source: "cmk.keys" }
    maxReconcileCount: 18

  plugins:
    - name: IDENTITY_MANAGEMENT
      path: ./bin/scim
      type: IdentityManagementService
      logLevel: debug
      tags: ["identity_management"]
      yamlConfiguration: |
        host:
          source: file
          file: { path: /etc/credentials/identity-management/scim.json, format: json, jsonPath: "$.host" }
        auth:
          type: mtls
          mtls:
            cert:
              source: file
              file: { path: /etc/credentials/identity-management/scim.json, format: json, jsonPath: "$.auth.cert" }
            certKey:
              source: file
              file: { path: /etc/credentials/identity-management/scim.json, format: json, jsonPath: "$.auth.certKey" }
        params:
          groupAttribute:
            source: file
            file: { path: /etc/credentials/identity-management/scim.json, format: json, jsonPath: "$.params.groupAttribute" }
          userAttribute:
            source: file
            file: { path: /etc/credentials/identity-management/scim.json, format: json, jsonPath: "$.params.userAttribute" }
          groupMembersAttribute:
            source: file
            file: { path: /etc/credentials/identity-management/scim.json, format: json, jsonPath: "$.params.groupMembersAttribute" }
          listMethod:
            source: file
            file: { path: /etc/credentials/identity-management/scim.json, format: json, jsonPath: "$.params.listMethod" }
        authContext:
          source: embedded
          value: |
            hostField: issuer
            basePath: idds/apps/v1/scim
            headerFields:
              x-app_tid: app_tid
              x-client_id: client_id

  # Local development only: every API server start adds this keystore to the pool again.
  # Never keep it enabled in another installation; see config.provisioning in values.yaml.
  provisioning:
    initKeystoreConfig:
      enabled: true
      provider: AWS
      value:
        localityId: 12345678-90ab-cdef-1234-567890abcdef
        commonName: example.kms.aws
        managementAccessData: |
          roleArn: arn:aws:iam::123456789012:role/KMSServiceRoleAnywhereRole
          trustAnchorArn: arn:aws:rolesanywhere:eu-west-2:123456789012:trust-anchor/12345678-90ab-cdef-1234-567890abcdef
          profileArn: arn:aws:rolesanywhere:eu-west-2:123456789012:profile/12345678-90ab-cdef-1234-567890abcdef
        supportedRegions:
          - { name: Europe (Frankfurt), technicalName: eu-central-1 }
          - { name: Europe (Ireland), technicalName: eu-west-1 }
          - { name: Europe (London), technicalName: eu-west-2 }
          - { name: United States (N. Virginia), technicalName: us-east-1 }
          - { name: United States (Ohio), technicalName: us-east-2 }

  keystorePool:
    supportedRegions:
      - { name: Europe (Frankfurt), technicalName: eu-central-1 }
      - { name: Europe (Ireland), technicalName: eu-west-1 }
      - { name: Europe (London), technicalName: eu-west-2 }
      - { name: United States (N. Virginia), technicalName: us-east-1 }
      - { name: United States (Ohio), technicalName: us-east-2 }

  clientData:
    authContextFields:
      - issuer
      - client_id
      - app_tid

  landscape:
    name: Local
    uiBaseUrl: http://localhost:8086/#
    region: eu

  audit:
    endpoint: http://otel-collector-opentelemetry-collector.cmk.svc.cluster.local:4318/v1/logs
    additionalProperties: |
      specVersion: "v1"
      appID: "cmk"
      folderPath: "/var/log/cmk"
      accountID: "123456789012"
      resourceGroupPath: "/cmk"
      region: "eu10"
      appImage: "cmk:latest"
      appVersion: "1.0.0"
